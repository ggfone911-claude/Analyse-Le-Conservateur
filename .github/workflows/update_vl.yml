name: Mise à jour quotidienne des VL Boursorama

on:
  schedule:
    - cron: '0 6 * * 1-5'
    - cron: '0 7 * * 6'
  workflow_dispatch:

jobs:
  update-vl:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # PAS de continue-on-error : un scraping muet a fige le site du 09/07
      # au 08/09/2026 sans qu'aucun run n'apparaisse en echec.
      - name: Scraping des VL et des performances sur Boursorama
        run: python scraper.py

      - name: Controle de fraicheur des donnees
        run: |
          python - <<'PY'
          import datetime, json, sys
          ov = json.load(open('vl_overrides.json'))
          bp = json.load(open('bourso_perf.json'))
          dates = sorted(v['date'] for v in ov.values() if v.get('date'))
          if not dates:
              print('ECHEC : aucune date de VL'); sys.exit(1)
          newest = datetime.date.fromisoformat(dates[-1])
          age = (datetime.date.today() - newest).days
          print(f"{len(ov)} fonds | VL la plus recente {newest} ({age} j) "
                f"| perfs {len(bp['data'])} fonds au {bp['last_updated']}")
          if age > 8:
              print('ECHEC : donnees perimees'); sys.exit(1)
          PY

      - name: Regeneration de index.html
        run: python gen_app_v2.py

      - name: Commit et push si changements
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Aucun changement detecte - pas de commit"
          else
            DATE=$(date '+%d/%m/%Y %H:%M')
            git commit -m "Mise a jour VL Boursorama - ${DATE}"
            git push
            echo "Deploye sur GitHub Pages"
          fi
